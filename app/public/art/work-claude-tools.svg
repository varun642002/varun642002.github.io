<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Ten small tools arranged on a shared rail">
  <defs>
    <linearGradient id="toolStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89AACC"/><stop offset="1" stop-color="#4E85BF"/>
    </linearGradient>
    <radialGradient id="toolGlow" cx="0.5" cy="0.5" r="0.68">
      <stop offset="0" stop-color="#89AACC" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#89AACC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#0a0a0a"/>
  <rect width="1200" height="800" fill="url(#toolGlow)"/>

  <!-- The session, left to right: each tool hooks into the same run. -->
  <path d="M90 400 H1110" stroke="url(#toolStroke)" stroke-opacity="0.45" stroke-width="2"/>
  <g fill="#89AACC" fill-opacity="0.55">
    <circle cx="90" cy="400" r="5"/><circle cx="1110" cy="400" r="5"/>
  </g>

  <!-- Five above the rail, five below: ten published tools. -->
  <g fill="#0a0a0a" stroke="url(#toolStroke)" stroke-width="2">
    <rect x="128" y="236" width="150" height="104" rx="10"/>
    <rect x="334" y="196" width="150" height="144" rx="10"/>
    <rect x="540" y="236" width="150" height="104" rx="10"/>
    <rect x="746" y="196" width="150" height="144" rx="10"/>
    <rect x="952" y="236" width="150" height="104" rx="10"/>

    <rect x="128" y="460" width="150" height="144" rx="10"/>
    <rect x="334" y="460" width="150" height="104" rx="10"/>
    <rect x="540" y="460" width="150" height="144" rx="10"/>
    <rect x="746" y="460" width="150" height="104" rx="10"/>
    <rect x="952" y="460" width="150" height="144" rx="10"/>
  </g>

  <!-- Each tool's connection to the session. -->
  <g stroke="#89AACC" stroke-opacity="0.4" stroke-width="1.6">
    <path d="M203 340 V400M409 340 V400M615 340 V400M821 340 V400M1027 340 V400"/>
    <path d="M203 400 V460M409 400 V460M615 400 V460M821 400 V460M1027 400 V460"/>
  </g>

  <!-- Content lines, so each block reads as a file rather than a box. -->
  <g fill="#89AACC" fill-opacity="0.42">
    <rect x="150" y="262" width="68" height="6" rx="3"/><rect x="150" y="280" width="104" height="5" rx="2.5"/><rect x="150" y="295" width="82" height="5" rx="2.5"/>
    <rect x="356" y="222" width="68" height="6" rx="3"/><rect x="356" y="240" width="104" height="5" rx="2.5"/><rect x="356" y="255" width="82" height="5" rx="2.5"/><rect x="356" y="270" width="96" height="5" rx="2.5"/>
    <rect x="562" y="262" width="68" height="6" rx="3"/><rect x="562" y="280" width="104" height="5" rx="2.5"/><rect x="562" y="295" width="82" height="5" rx="2.5"/>
    <rect x="768" y="222" width="68" height="6" rx="3"/><rect x="768" y="240" width="104" height="5" rx="2.5"/><rect x="768" y="255" width="82" height="5" rx="2.5"/><rect x="768" y="270" width="96" height="5" rx="2.5"/>
    <rect x="974" y="262" width="68" height="6" rx="3"/><rect x="974" y="280" width="104" height="5" rx="2.5"/><rect x="974" y="295" width="82" height="5" rx="2.5"/>

    <rect x="150" y="486" width="68" height="6" rx="3"/><rect x="150" y="504" width="104" height="5" rx="2.5"/><rect x="150" y="519" width="82" height="5" rx="2.5"/><rect x="150" y="534" width="96" height="5" rx="2.5"/>
    <rect x="356" y="486" width="68" height="6" rx="3"/><rect x="356" y="504" width="104" height="5" rx="2.5"/><rect x="356" y="519" width="82" height="5" rx="2.5"/>
    <rect x="562" y="486" width="68" height="6" rx="3"/><rect x="562" y="504" width="104" height="5" rx="2.5"/><rect x="562" y="519" width="82" height="5" rx="2.5"/><rect x="562" y="534" width="96" height="5" rx="2.5"/>
    <rect x="768" y="486" width="68" height="6" rx="3"/><rect x="768" y="504" width="104" height="5" rx="2.5"/><rect x="768" y="519" width="82" height="5" rx="2.5"/>
    <rect x="974" y="486" width="68" height="6" rx="3"/><rect x="974" y="504" width="104" height="5" rx="2.5"/><rect x="974" y="519" width="82" height="5" rx="2.5"/><rect x="974" y="534" width="96" height="5" rx="2.5"/>
  </g>
</svg>
